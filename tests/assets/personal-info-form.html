<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Personal Information Form</title>
        <script src="../../dist/ax.js"></script>
        <style>
            .field-error {
                color: #d32f2f;
                font-size: 0.85em;
                display: none;
                margin: 2px 0 0 2px;
            }
            .field-error.visible {
                display: block;
            }
            .field-group {
                margin-bottom: 1em;
            }
            .name-row {
                display: flex;
                gap: 0.5em;
            }
            .name-row label {
                flex: 1;
            }
            .form-error {
                color: #d32f2f;
                font-size: 0.9em;
                display: none;
                margin-bottom: 1em;
                padding: 0.5em;
                border: 1px solid #d32f2f;
                border-radius: 4px;
                background: #fff5f5;
            }
            .form-error.visible {
                display: block;
            }
            .success-msg {
                color: #2e7d32;
                font-size: 0.9em;
                display: none;
                margin-bottom: 1em;
                padding: 0.5em;
                border: 1px solid #2e7d32;
                border-radius: 4px;
                background: #f5fff5;
            }
            .success-msg.visible {
                display: block;
            }
            input.error,
            select.error {
                border-color: #d32f2f;
                outline: 1px solid #d32f2f;
            }
        </style>
    </head>
    <body>
        <!--
    User flow: fill in personal details, submit
    Annotations demonstrate: view, edit (split names), click, ax-ctx, ax-ignore, hooks
    Inline script provides validation logic called by ax hooks.
    Error scenarios: empty required, invalid email, phone format, password mismatch
    -->

        <div class="form-error" id="formError" ax-view="form error"></div>
        <div class="success-msg" id="successMsg" ax-view="success message">
            Registration submitted successfully.
        </div>

        <form ax-ctx="signup" ax-edit="personal info" id="signupForm">
            <h2 ax-view="form title">Create your account</h2>

            <!-- Name fields: first + optional middle + last -->
            <div ax-view="name section" class="field-group">
                <div class="name-row">
                    <label>
                        First name <span style="color: #d32f2f">*</span>
                        <input
                            ax-edit="first name"
                            type="text"
                            required
                            placeholder="Jane"
                            data-ax-validate="required"
                        />
                        <span class="field-error" id="firstNameError"
                            >First name is required</span
                        >
                    </label>
                    <label>
                        Middle name
                        <input
                            ax-edit="middle name"
                            type="text"
                            placeholder="M."
                            data-ax-validate="none"
                        />
                    </label>
                    <label>
                        Last name <span style="color: #d32f2f">*</span>
                        <input
                            ax-edit="last name"
                            type="text"
                            required
                            placeholder="Doe"
                            data-ax-validate="required"
                        />
                        <span class="field-error" id="lastNameError"
                            >Last name is required</span
                        >
                    </label>
                </div>
            </div>

            <!-- Email field -->
            <div class="field-group">
                <label>
                    Email address <span style="color: #d32f2f">*</span>
                    <input
                        ax-edit="email"
                        type="email"
                        required
                        placeholder="jane@example.com"
                        data-ax-validate="email"
                    />
                    <span class="field-error" id="emailError"
                        >Enter a valid email address</span
                    >
                </label>
            </div>

            <!-- Phone field -->
            <div class="field-group">
                <label>
                    Phone number
                    <input
                        ax-edit="phone"
                        type="tel"
                        placeholder="+1 555 000 0000"
                        data-ax-validate="phone"
                    />
                    <span class="field-error" id="phoneError"
                        >Enter a valid phone number (e.g. +1 555 000 0000)</span
                    >
                </label>
            </div>

            <!-- Country select -->
            <div class="field-group">
                <label>
                    Country <span style="color: #d32f2f">*</span>
                    <select
                        ax-edit="country"
                        required
                        data-ax-validate="required"
                    >
                        <option value="">— Select —</option>
                        <option value="US">United States</option>
                        <option value="UK">United Kingdom</option>
                        <option value="DE">Germany</option>
                        <option value="JP">Japan</option>
                    </select>
                    <span class="field-error" id="countryError"
                        >Please select a country</span
                    >
                </label>
            </div>

            <!-- Marketing preference -->
            <div class="field-group">
                <label>
                    <input ax-edit="marketing consent" type="checkbox" />
                    Send me product updates
                </label>
            </div>

            <!-- Password fields -->
            <div class="field-group">
                <label>
                    Password <span style="color: #d32f2f">*</span>
                    <input
                        ax-edit="password"
                        type="password"
                        required
                        minlength="8"
                        placeholder="At least 8 characters"
                        data-ax-validate="password"
                    />
                </label>
            </div>
            <div class="field-group">
                <label>
                    Confirm password <span style="color: #d32f2f">*</span>
                    <input
                        ax-edit="confirm password"
                        type="password"
                        required
                        placeholder="Repeat password"
                        data-ax-validate="confirm"
                    />
                    <span class="field-error" id="confirmError"
                        >Passwords do not match</span
                    >
                </label>
            </div>

            <!-- Honeypot (excluded from agent view) -->
            <div ax-ignore style="display: none" aria-hidden="true">
                <input
                    type="text"
                    name="website"
                    tabindex="-1"
                    autocomplete="off"
                />
            </div>

            <!-- Submit button with hooks -->
            <button
                ax-click="submit registration"
                ax-before-click="(ctx) => validateForm(ctx.el.form)"
                ax-on-click="(ctx) => submitRegistration(ctx.el.form)"
                ax-after-click="(ctx) => handleSubmitResult(ctx)"
                type="submit"
            >
                Create account
            </button>

            <p ax-view="legal notice">
                By clicking Create account you agree to our Terms of Service.
            </p>
        </form>

        <script>
            // Functions are defined as globals (var) so ax's new Function eval can resolve them.
            // In a browser, these become window.* properties automatically.

            var BLOCKED_DOMAINS = [
                "tempmail.com",
                "mailinator.com",
                "guerrillamail.com",
            ];

            function getField(form, name) {
                return form.querySelector('[ax-edit="' + name + '"]');
            }

            function showError(id, visible) {
                var el = document.getElementById(id);
                if (el) el.classList.toggle("visible", visible);
            }

            function markField(name, hasError) {
                var el = getField(document.getElementById("signupForm"), name);
                if (el) el.classList.toggle("error", hasError);
            }

            function clearAllErrors(form) {
                form.querySelectorAll(".field-error").forEach(function (el) {
                    el.classList.remove("visible");
                });
                form.querySelectorAll("input.error, select.error").forEach(
                    function (el) {
                        el.classList.remove("error");
                    },
                );
                document
                    .getElementById("formError")
                    .classList.remove("visible");
                document.getElementById("formError").textContent = "";
                document
                    .getElementById("successMsg")
                    .classList.remove("visible");
            }

            /**
             * Validate the entire form.
             * Called by ax-before-click on the submit button.
             * Returns true if valid, false to cancel submission.
             */
            function validateForm(form) {
                clearAllErrors(form);
                var valid = true;

                // First name (required)
                var firstName = getField(form, "first name");
                if (!firstName || !firstName.value.trim()) {
                    showError("firstNameError", true);
                    markField("first name", true);
                    valid = false;
                }

                // Last name (required)
                var lastName = getField(form, "last name");
                if (!lastName || !lastName.value.trim()) {
                    showError("lastNameError", true);
                    markField("last name", true);
                    valid = false;
                }

                // Email (required + format)
                var email = getField(form, "email");
                if (!email || !email.value.trim()) {
                    showError("emailError", true);
                    markField("email", true);
                    valid = false;
                } else if (
                    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())
                ) {
                    showError("emailError", true);
                    email.classList.add("error");
                    valid = false;
                }

                // Phone (optional but must be valid if provided)
                var phone = getField(form, "phone");
                if (phone && phone.value.trim()) {
                    var cleaned = phone.value.trim().replace(/[\s\-\(\)]/g, "");
                    if (!/^\+?\d{7,15}$/.test(cleaned)) {
                        showError("phoneError", true);
                        markField("phone", true);
                        valid = false;
                    }
                }

                // Country (required)
                var country = getField(form, "country");
                if (!country || !country.value) {
                    showError("countryError", true);
                    markField("country", true);
                    valid = false;
                }

                // Password (minlength handled natively but check explicitly)
                var password = getField(form, "password");
                if (!password || !password.value || password.value.length < 8) {
                    password.classList.add("error");
                    valid = false;
                }

                // Confirm password (must match)
                var confirmPw = getField(form, "confirm password");
                var pwVal = password ? password.value : "";
                if (!confirmPw || confirmPw.value !== pwVal) {
                    showError("confirmError", true);
                    markField("confirm password", true);
                    valid = false;
                }

                if (!valid) {
                    document.getElementById("formError").textContent =
                        "Please fix the highlighted fields before submitting.";
                    document
                        .getElementById("formError")
                        .classList.add("visible");
                    return false;
                }

                return true;
            }

            /**
             * Submit the registration.
             * Called by ax-on-click on the submit button.
             */
            function submitRegistration(form) {
                var payload = {
                    firstName: getField(form, "first name").value.trim(),
                    middleName: getField(form, "middle name").value.trim(),
                    lastName: getField(form, "last name").value.trim(),
                    email: getField(form, "email").value.trim(),
                    phone: getField(form, "phone").value.trim(),
                    country: getField(form, "country").value,
                    marketingConsent: getField(form, "marketing consent")
                        .checked,
                };
                return payload;
            }

            /**
             * Handle after-submit result.
             * Called by ax-after-click.
             */
            function handleSubmitResult(ctx) {
                if (ctx.canceled) return;
                if (ctx.result) {
                    document
                        .getElementById("successMsg")
                        .classList.add("visible");
                    ctx.el.form.reset();
                }
            }

            function isBlockedEmail(email) {
                var domain = email.split("@").pop().toLowerCase();
                return BLOCKED_DOMAINS.indexOf(domain) !== -1;
            }
        </script>
    </body>
</html>
